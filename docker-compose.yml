services:
  hardhat-node:
    image: node:22.10-bullseye
    container_name: evoting-hardhat-node
    working_dir: /usr/src/app/blockchain
    volumes:
      - ./:/usr/src/app
    ports:
      - "8545:8545"
    command: sh -c "cd /usr/src/app/blockchain && npm install && npx hardhat node --hostname 0.0.0.0 --port 8545"
    networks:
      - evoting-net

  deploy:
    image: node:22.10-bullseye
    container_name: evoting-deploy
    depends_on:
      - hardhat-node
    working_dir: /usr/src/app/blockchain
    volumes:
      - ./:/usr/src/app
    environment:
      NODE_URL: "http://hardhat-node:8545"
    command: sh -c "cd /usr/src/app/blockchain && npm install && node scripts/wait-for-node.mjs && npx hardhat run scripts/deploy.js --network hardhat-node"
    networks:
      - evoting-net
    restart: "no"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evoting-frontend
    depends_on:
      - hardhat-node
      - deploy
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/src/app
      - node_modules:/usr/src/app/node_modules
    environment:
      NEXT_PUBLIC_CHAIN_ID: "31337"
      NEXT_PUBLIC_RPC_URL: "http://hardhat-node:8545"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    networks:
      - evoting-net

volumes:
  node_modules:

networks:
  evoting-net:
    driver: bridge
